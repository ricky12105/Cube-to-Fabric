<rect x="390" y="500" width="1010" height="135" rx="12" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text x="895" y="538.7" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="895" dy="0">JUSTIFY ONLY WITH EVIDENCE</tspan>
<tspan x="895" dy="23.400000000000002">Option 1: required summary grain, limited relationships or Excel tests fail after tuning.</tspan>
<tspan x="895" dy="23.400000000000002">Option 2: required grain cannot fit Import/refresh budget or critical queries cannot hit aggregates.</tspan>
<tspan x="895" dy="23.400000000000002">Both must fail agreed SLAs; rule out Snowflake/network/copy bottlenecks before buying capacity.</tspan>
</text>
<text x="40" y="693" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="start">
<tspan x="40" dy="0">FIRST TEST: only after Options 1 and 2 fail, propose a separate synthetic sandbox benchmark and seek approval. No resource changes were made.</tspan>
</text>
