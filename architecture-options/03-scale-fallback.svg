<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1060" viewBox="0 0 1840 1060" role="img" aria-labelledby="03-scale-fallback-title">
<defs>
<marker id="dl-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0078D4"/></marker>
<marker id="imp-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#5C2D91"/></marker>
<marker id="dq-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#F7630C"/></marker>
<marker id="neutral-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#495057"/></marker>
<marker id="issue-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#D13438"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text id="03-scale-fallback-title" data-role="title" x="40" y="50" font-family="Arial, sans-serif" font-size="30" fill="black" text-anchor="start">
<tspan x="40" dy="0">Option 3 - LAST RESORT: scale only after F64 model-change tests fail</tspan>
</text>
<text id="03-scale-fallback-subtitle" data-role="note" x="40" y="96" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="start">
<tspan x="40" dy="0">No grain change. F128 cannot hold a 4B-row Direct Lake table; F256 fits by row count, not automatically by memory or throughput.</tspan>
</text>
<rect id="03-scale-fallback-lane-0" data-role="lane-header" x="40" y="135" width="300" height="52" rx="10" fill="transparent" stroke="#CBD5E1" stroke-width="2"/>
<text id="03-scale-fallback-lane-0-label" data-role="bound-label" data-container="03-scale-fallback-lane-0" x="190" y="167.3" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="190" dy="0">SOURCE</tspan>
</text>
<rect id="03-scale-fallback-lane-1" data-role="lane-header" x="400" y="135" width="300" height="52" rx="10" fill="transparent" stroke="#CBD5E1" stroke-width="2"/>
<text id="03-scale-fallback-lane-1-label" data-role="bound-label" data-container="03-scale-fallback-lane-1" x="550" y="167.3" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="550" dy="0">LANDING / PUBLICATION</tspan>
</text>
<rect id="03-scale-fallback-lane-2" data-role="lane-header" x="760" y="135" width="300" height="52" rx="10" fill="transparent" stroke="#CBD5E1" stroke-width="2"/>
<text id="03-scale-fallback-lane-2-label" data-role="bound-label" data-container="03-scale-fallback-lane-2" x="910" y="167.3" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="910" dy="0">STORAGE / CACHE</tspan>
</text>
<rect id="03-scale-fallback-lane-3" data-role="lane-header" x="1120" y="135" width="300" height="52" rx="10" fill="transparent" stroke="#CBD5E1" stroke-width="2"/>
<text id="03-scale-fallback-lane-3-label" data-role="bound-label" data-container="03-scale-fallback-lane-3" x="1270" y="167.3" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="1270" dy="0">SEMANTIC MODEL</tspan>
</text>
<rect id="03-scale-fallback-lane-4" data-role="lane-header" x="1480" y="135" width="300" height="52" rx="10" fill="transparent" stroke="#CBD5E1" stroke-width="2"/>
<text id="03-scale-fallback-lane-4-label" data-role="bound-label" data-container="03-scale-fallback-lane-4" x="1630" y="167.3" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="1630" dy="0">CONSUMERS</tspan>
</text>
<rect id="03-scale-fallback-source" data-role="primary" x="40" y="210" width="300" height="220" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text id="03-scale-fallback-source-label" data-role="bound-label" data-container="03-scale-fallback-source" x="190" y="279.5" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="190" dy="0">Snowflake on AWS</tspan>
<tspan x="190" dy="23.4">System of record</tspan>
<tspan x="190" dy="23.4">Policy rows: 1.5B -&gt; 4B*</tspan>
<tspan x="190" dy="23.4">All 15 years assumed*</tspan>
<tspan x="190" dy="23.4">Source compute: Snowflake</tspan>
</text>
<rect id="03-scale-fallback-publication" data-role="primary" x="400" y="210" width="300" height="220" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text id="03-scale-fallback-publication-label" data-role="bound-label" data-container="03-scale-fallback-publication" x="550" y="279.5" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="550" dy="0">Existing pipeline copy</tspan>
<tspan x="550" dy="23.4">Daily increments*</tspan>
<tspan x="550" dy="23.4">Same reliability exposure</tspan>
<tspan x="550" dy="23.4">Same transfer / egress</tspan>
<tspan x="550" dy="23.4">No ingestion redesign</tspan>
</text>
<rect id="03-scale-fallback-detail-storage" data-role="primary" x="760" y="210" width="300" height="220" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text id="03-scale-fallback-detail-storage-label" data-role="bound-label" data-container="03-scale-fallback-detail-storage" x="910" y="279.5" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="910" dy="0">OneLake Delta detail</tspan>
<tspan x="910" dy="23.4">1.5B -&gt; 4B rows* / 15y*</tspan>
<tspan x="910" dy="23.4">Full second detail copy</tspan>
<tspan x="910" dy="23.4">No grain change</tspan>
<tspan x="910" dy="23.4">Storage still required</tspan>
</text>
<rect id="03-scale-fallback-detail-model" data-role="primary" x="1120" y="210" width="300" height="220" rx="10" fill="#EEF3F8" stroke="#6F8DA9" stroke-width="2"/>
<text id="03-scale-fallback-detail-model-label" data-role="bound-label" data-container="03-scale-fallback-detail-model" x="1270" y="279.5" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="1270" dy="0">Single Direct Lake fact</tspan>
<tspan x="1270" dy="23.4">F128: 3B max; 50 GB</tspan>
<tspan x="1270" dy="23.4">4B fails on F128</tspan>
<tspan x="1270" dy="23.4">F256: 6B max; 100 GB</tspan>
<tspan x="1270" dy="23.4">4B leaves 2B row margin</tspan>
</text>
<rect id="03-scale-fallback-consumers" data-role="primary" x="1480" y="210" width="300" height="220" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text id="03-scale-fallback-consumers-label" data-role="bound-label" data-container="03-scale-fallback-consumers" x="1630" y="279.5" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="1630" dy="0">Power BI + Excel</tspan>
<tspan x="1630" dy="23.4">Same DL / MDX limits</tspan>
<tspan x="1630" dy="23.4">All 15y at policy grain*</tspan>
<tspan x="1630" dy="23.4">Scaling does not redesign</tspan>
<tspan x="1630" dy="23.4">or restore cube features</tspan>
</text>
<path id="03-scale-fallback-source-to-copy" data-role="connector" data-start="03-scale-fallback-source" data-end="03-scale-fallback-publication" d="M348,320 L392,320" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#neutral-arrow)"/>
<path id="03-scale-fallback-copy-to-storage" data-role="connector" data-start="03-scale-fallback-publication" data-end="03-scale-fallback-detail-storage" d="M708,320 L752,320" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#neutral-arrow)"/>
<path id="03-scale-fallback-storage-to-model" data-role="connector" data-start="03-scale-fallback-detail-storage" data-end="03-scale-fallback-detail-model" d="M1068,320 L1112,320" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#dl-arrow)"/>
<path id="03-scale-fallback-model-to-consumers" data-role="connector" data-start="03-scale-fallback-detail-model" data-end="03-scale-fallback-consumers" d="M1428,320 L1472,320" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#dl-arrow)"/>
<rect id="03-scale-fallback-fallback-gate" data-role="callout" x="400" y="510" width="1020" height="170" rx="10" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text id="03-scale-fallback-fallback-gate-label" data-role="bound-label" data-container="03-scale-fallback-fallback-gate" x="910" y="566.2" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="middle">
<tspan x="910" dy="0">GATED FALLBACK - EVIDENCE REQUIRED</tspan>
<tspan x="910" dy="23.4">Option 1: required grain, limited relationships or Excel tests still fail after tuning.</tspan>
<tspan x="910" dy="23.4">Option 2: required cache / refresh cannot fit, or critical queries cannot hit aggregates.</tspan>
<tspan x="910" dy="23.4">Both must fail agreed criteria for a capacity-solvable reason; a stuck copy is not one.</tspan>
</text>
<text id="03-scale-fallback-first-test" data-role="note" x="40" y="788" font-family="Arial, sans-serif" font-size="18" fill="black" text-anchor="start">
<tspan x="40" dy="0">FIRST TEST: only after both F64 patterns fail, propose an approved synthetic sandbox benchmark on the larger SKU.</tspan>
<tspan x="40" dy="23.4">No scale-up or tenant inspection was performed; check working set, throughput and other workload occupancy.</tspan>
</text>
