</text>
<text id="03-scale-fallback-legend-flow" data-role="note" x="40" y="976" font-family="Arial, sans-serif" font-size="16" fill="black" text-anchor="start">
<tspan x="40" dy="0">Architecture arrows: solid = publication / summary path; dashed double arrows = on-demand queries and results. Inset lines show relationships.</tspan>
</text>
<text id="03-scale-fallback-legend-assumptions" data-role="note" x="40" y="1006" font-family="Arial, sans-serif" font-size="16" fill="black" text-anchor="start">
